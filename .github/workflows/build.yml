name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
      - run: flutter create --platforms=android --org com.fredel --project-name afrifilm_tv .
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: afrifilm-apk
          path: build/app/outputs/flutter-apk/*.apk
          
