workflows:
  afrifilm-android:
    name: AfriFilm Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
    scripts:
      - name: Creer le projet Android
        script: flutter create --platforms=android --org com.fredel --project-name afrifilm_tv .
      - name: Autoriser Internet
        script: |
          sed -i.bak 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
      - name: Recuperer les paquets
        script: flutter pub get
      - name: Construire l APK
        script: flutter build apk --debug --split-per-abi
    artifacts:
      - build/**/outputs/**/*.apk
      
