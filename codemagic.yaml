workflows:
  afrifilm-android:
    name: AfriFilm Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
    scripts:
      - name: Creer le projet Android
        script: flutter create --platforms=android --org com.fredel.v2 --project-name afrifilm_tv .
      - name: Configurer AndroidManifest proprement
        script: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application android:usesCleartextTraffic=\"true\"", 1)
          open(p, "w").write(s)
          '
      - name: Recuperer les paquets
        script: flutter pub get
      - name: Construire l APK
        script: flutter build apk --debug --split-per-abi
    artifacts:
      - build/**/outputs/**/*.apk
      
